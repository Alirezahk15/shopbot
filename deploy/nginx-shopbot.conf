# /etc/nginx/sites-available/shopbot
#
# The setup wizard writes this file for you. For a manual install:
#   sudo cp deploy/nginx-shopbot.conf /etc/nginx/sites-available/shopbot
#   sudo sed -i 's/YOUR_DOMAIN/bot.example.com/' /etc/nginx/sites-available/shopbot
#   sudo ln -s /etc/nginx/sites-available/shopbot /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bot.example.com

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 50m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Backups, CSV exports and broadcasts can run well past 60s.
        # Without these the panel shows a 504 while the job is still running.
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        proxy_buffering off;
    }
}
